name: Re-save upstream drift baseline

# When a weekly upstream merge PR (opened by `merge_upstream_zed.yml`) is
# merged, re-save `script/upstream-drift-baseline.json` and open a one-file PR
# with the result, so drift reports measure from a fully synced fork.
#
# This runs after the merge lands rather than inside `merge_upstream_zed.yml`
# because that job commits conflict markers when the merge conflicts, which
# every weekly merge from 2026-08-24 to 2026-09-14 did. Only the resolved tree
# on main gives meaningful numbers.

on:
  pull_request:
    types: [closed]
    branches: [main]

# Serialized but never cancelled: a cancelled run can leave a pushed branch
# with no PR.
concurrency:
  group: upstream-drift-baseline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  resave:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/merge-upstream-zed-')
    runs-on: ubuntu-latest
    # One zed/main fetch plus one drift script run. Runaway protection only.
    timeout-minutes: 15
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "paddleboard-bot"
          git config user.email "paddleboard-bot@users.noreply.github.com"

      - name: Fetch upstream Zed
        run: |
          git remote add zed https://github.com/zed-industries/zed.git
          git fetch zed main --no-tags

      - name: Re-save baseline
        id: save
        run: |
          # A squash or rebase merge drops upstream ancestry, so the merge base
          # below would be an older upstream commit and the baseline silently wrong.
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ne 3 ]; then
            echo "::error::#${{ github.event.pull_request.number }} was not merged with a merge commit, so the merged upstream commit can't be identified. Re-save the baseline by hand."
            exit 1
          fi

          # The newest upstream commit on main is the one this merge brought in.
          # zed/main's tip is usually further ahead, and saving against the tip
          # would count those unmerged upstream changes as fork drift.
          upstream_sha=$(git merge-base HEAD zed/main)
          UPSTREAM_REF="$upstream_sha" ./script/check-upstream-drift --no-fetch --save-baseline > /dev/null
          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"

      - name: Open baseline PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_PR: ${{ github.event.pull_request.number }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          UPSTREAM_SHA: ${{ steps.save.outputs.upstream_sha }}
        run: |
          if git diff --quiet -- script/upstream-drift-baseline.json; then
            echo "Baseline already matches main. Nothing to do."
            exit 0
          fi

          branch="chore/upstream-drift-baseline-after-${MERGED_PR}"
          # A re-run for the same merge would otherwise fail the push non-fast-forward.
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists on origin. Nothing to do."
            exit 0
          fi

          title="Re-save the upstream drift baseline after #${MERGED_PR}"
          git checkout -b "$branch"
          git add script/upstream-drift-baseline.json
          git -c commit.gpgsign=false commit -m "$title"
          git push --set-upstream origin "$branch"

          {
            echo "Upstream merge #${MERGED_PR} is on main, so this re-saves \`script/upstream-drift-baseline.json\` from the resolved tree. Drift reports then measure from a fully synced fork."
            echo ""
            echo "- Main: \`${MERGE_COMMIT_SHA}\`"
            echo "- Upstream: \`zed-industries/zed@${UPSTREAM_SHA}\`, the newest upstream commit on main"
            echo ""
            echo "Only the baseline file changes. PRs opened with the workflow token don't run CI automatically."
            echo ""
            echo "_Generated by \`.github/workflows/upstream-drift-baseline.yml\`._"
            echo ""
            echo "Release Notes:"
            echo ""
            echo "- N/A"
          } > pr_body.md

          gh pr create --base main --head "$branch" --title "$title" --body-file pr_body.md
