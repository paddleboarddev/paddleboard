name: Fork guards

# Cheap checks (seconds, no compile) for mistakes that build fine and only show
# up later: "Zed" strings reaching the UI after an upstream merge, the two
# llama.cpp pin copies drifting apart, upstream files resurrected inside
# directories this fork deleted, personal files committed by accident, and a PR
# whose author hasn't yet confirmed reviewing what an agent wrote.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cheap, so it keeps both triggers. This just stops superseded runs on a
# re-pushed branch.
concurrency:
  group: fork-guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for fork-rename breakage (zed-isms)
        run: bash script/check-zed-isms
      - name: Check llama.cpp pins are in sync
        run: bash script/check-llama-pins
      - name: Check for zombie files in deleted upstream dirs
        # Covers hand-resolved merges that skip the weekly merge workflow.
        run: bash script/check-zombie-upstream-files
      - name: Check no personal files are committed
        # `.private/` and `.claude/` are gitignored (see CONTRIBUTING.md,
        # "Keeping your own files"); this catches the one way past that, `git add -f`.
        run: |
          tracked="$(git ls-files -- .private .claude)"
          if [ -n "$tracked" ]; then
            echo "These are personal files and must not be committed:" >&2
            echo "$tracked" >&2
            exit 1
          fi
      - name: Check the review banner has been removed
        # Agents put a two-line banner at the top of README.md when they change
        # source files (`.rules`), and only the PR's author removes it. This
        # fails until they have, so it can't be merged by mistake.
        run: |
          if [ "$(head -n 2 README.md)" = "$(printf '%s\n%s' '> [!IMPORTANT]' "> Remove this line to confirm you've reviewed this PR before submitting.")" ]; then
            echo "::error file=README.md,line=1::An agent wrote part of this PR. Review its changes, then remove the two banner lines at the top of README.md to confirm you have. See CONTRIBUTING.md, \"Agent-written changes\"."
            exit 1
          fi
