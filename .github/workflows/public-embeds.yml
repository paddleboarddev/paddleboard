name: Public snapshot embed check

# Runs `script/check-public-embeds` on every PR: verifies that every
# compile-time file embed (include_str!/include_bytes!) resolves inside the
# public source snapshot (git archive minus publish-public.sh's EXCLUDES).
#
# Why: an embed pointing at a stripped path (.claude, RECAPS.md, …) builds
# fine in this private repo and breaks every fresh clone of the public repo —
# that shipped broken from v0.1.0 to v0.1.2 before the v0.1.2.1 hotfix.
# publish-public.sh runs the same gate at publish time; this workflow catches
# the bad include at PR time instead.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cheap (seconds, no compile), so it keeps both triggers — only the two heavy
# Rust jobs were trimmed. This just stops superseded runs on a re-pushed branch.
concurrency:
  group: public-embeds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded paths against the public snapshot
        run: bash script/check-public-embeds
      - name: Check for fork-rename breakage (zed-isms)
        run: bash script/check-zed-isms
      - name: Check llama.cpp pins are in sync
        run: bash script/check-llama-pins
      - name: Check for zombie files in deleted upstream dirs
        # Cheap (git ls-files only, no upstream fetch), so it runs on every PR —
        # which covers hand-resolved merges that skip the weekly merge workflow.
        run: bash script/check-zombie-upstream-files
