name: Compile and lint

# PaddleBoard: the compile gate. Until this existed, NO workflow in this repo
# built Rust — the other PR checks cover embeds, zed-isms, llama pins, and
# upstream drift, none of which touch the compiler. A dependency bump that broke
# the build passed CI green, and the only real gate was someone remembering to
# run `cargo check` locally. That went wrong quietly during the 2026-07-21
# Dependabot triage, where every Rust bump had to be hand-verified.
#
# The Linux job LINTS as well as compiles, as of 2026-08-12. It ran plain
# `cargo check` until then, and nothing in this repo ran clippy at all — so
# `./script/clippy` broke on 2026-08-10 (the upstream merge that bumped rustc to
# 1.97) and stayed broken, silently, until someone ran it by hand. Clippy aborts
# at the first failing crate, so the single error it reported was masking 21
# more. That is the failure mode this now gates.
#
# `cargo clippy` SUBSUMES `cargo check` — it runs the same compilation and adds
# lints — so this REPLACES the check step rather than adding a job. No new
# billing line, same PR-only trigger, same concurrency group.
#
# Deliberately NOT `script/clippy`, which is `--release --all-targets
# --all-features` across 267 crates — a release build's worth of work, far too
# heavy per-PR. Debug + default features is the cheap config, and it is enough:
# the 2026-08-10 breakage was in unconditionally-compiled code, so this would
# have caught it. The gap that leaves is lints reachable only under a non-default
# feature; `script/clippy` locally remains the full check.
#
# `--all-targets` includes test and bench code. A dependency's API change often
# surfaces in a test first, so omitting it would leave the common case unchecked.
#
# THE TRADEOFF IS REAL: a weekly upstream merge can now redden this gate with
# lints nobody here can fix. Sized from the 2026-08-12 sweep, that risk is small
# — 1 of 22 sites was upstream-authored — and PaddleBoard shares upstream's
# pinned toolchain, so upstream's own clippy CI keeps their tree mostly clean.
# If it does become a recurring tax, drop `--deny warnings` before dropping the
# job: a lint gate that only reports is still worth more than no gate.

on:
  pull_request:
    branches: [main]
    paths-ignore: &docs_only
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE*"
  # The push trigger is KEPT here, unlike test.yml, but only the macOS job still
  # uses it — see the `if:` on each job below.
  push:
    branches: [main]
    paths-ignore: *docs_only

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  linux:
    # Stock runner, NOT Blacksmith. release.yml uses Blacksmith because the
    # stock 7 GB runner OOM-killed the release LINK phase — but `cargo check`
    # never links, so that justification doesn't carry over.
    #
    # This was also forced: on the first attempt this job used
    # `blacksmith-8vcpu-ubuntu-2204` and sat QUEUED with runner=unassigned for
    # 50 minutes while the macOS job passed repeatedly. release.yml's Blacksmith
    # job is triggered by a TAG PUSH; this one runs on `pull_request`, and
    # Blacksmith never picked it up. If a Blacksmith runner is wanted here
    # later, verify it provisions for pull_request events first.
    name: Linux (full workspace)
    runs-on: ubuntu-latest
    # PaddleBoard: PR-only since 2026-08-04. This job ran on both `pull_request`
    # and `push: main`, so every merged PR paid for it twice — 256 billable
    # minutes over 2026-08-03/04, second only to test.yml. The workflow keeps its
    # push trigger solely so the macOS job below (which is push-ONLY, and cheap at
    # ~23s a run) still fires; without this guard, removing the trigger outright
    # would have silently disabled macOS coverage entirely.
    if: github.event_name == 'pull_request'
    # 60, up from 45 on 2026-08-12: clippy does the same compilation as
    # `cargo check` plus a lint pass, and a cold run was already ~29 min.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Reclaim disk before building. On 2026-08-03 this job began failing with
      # `System.IO.IOException: No space left on device` — the runner died while
      # writing its OWN diagnostic log, so the error names a runner path and not
      # anything of ours, which makes it read like infrastructure noise rather
      # than a workspace that outgrew the disk. It hit three PRs and `main` in
      # one afternoon, and re-running never cleared it.
      #
      # The cause is size, not luck: `cargo check --all-targets` over the full
      # workspace grew past what a stock ubuntu-latest runner has spare once the
      # 2026-08-03 upstream merge landed. These preinstalled toolchains are worth
      # ~15 GB and nothing here uses them — this job needs apt packages and
      # rustup, both untouched below. `/opt/hostedtoolcache` is deliberately NOT
      # removed: `actions/*` steps resolve tools from it.
      #
      # The `df -h` bookends are for the next person: if this fails again, the
      # log says how much was actually free rather than leaving them to guess.
      - name: Free runner disk space
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          echo "After:"
          df -h /

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Install webview (wry) system dependencies
        # Same stack release.yml installs: the `browser` crate uses `wry`, whose
        # Linux build needs GTK3 + WebKit2GTK. script/linux is Zed's dep set and
        # omits these because upstream has no embedded browser. libssl-dev and
        # pkg-config are needed by openssl-sys, pulled in on Linux only via
        # native-tls behind paddleboard_rag's `pgvector` feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev clang libssl-dev pkg-config

      - name: Set up Rust
        # rust-toolchain.toml pins the channel, so this resolves to it.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: compile-check-linux

      - name: cargo clippy --workspace --all-targets
        env:
          CC: clang
          CXX: clang++
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings

  macos:
    # Narrow by design. A Linux-only gate cannot see macOS-gated code — the
    # `mach2` bump in #67 is exactly that shape, and would have sailed through.
    # A full macOS workspace check bills at the 10x runner multiplier, so this
    # checks only the workspace members that declare macOS-gated dependencies.
    # Their dependency trees pull in a large share of the workspace anyway.
    #
    # If a new crate gains a `cfg(target_os = "macos")` dependency, add it here.
    # Find them with:
    #   grep -rln 'cfg(target_os = "macos")' crates/*/Cargo.toml
    #
    # MAIN-ONLY since 2026-07-28, for cost. At the 10x multiplier this job bills
    # roughly ten times its ~2-3 min wall clock on every run, and it was the
    # single largest line in this repo's CI spend. Personal-account repos cannot
    # use WarpBuild, so there is no cheaper runner to move it to — the only lever
    # left is running it less often.
    #
    # THE TRADEOFF IS REAL: macOS-gated breakage is no longer caught before
    # merge, only after it lands on main. If a macOS-only regression does escape,
    # a red main is the intended signal — fix forward, don't assume the gate is
    # broken. Revert to running on pull_request if that happens more than rarely.
    # Still `cargo check`, NOT clippy, unlike the Linux job above. Deliberate:
    # this bills at the 10x multiplier, and the Linux job already lints every
    # crate that is not macOS-gated. The gap that leaves is lints reachable only
    # under `cfg(target_os = "macos")` — narrow, and `./script/clippy` on a Mac
    # covers it locally. Switch this to clippy if a macOS-only lint ever escapes.
    name: macOS (platform crates)
    runs-on: macos-15
    if: github.event_name == 'push'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: compile-check-macos

      - name: cargo check (macOS-gated crates)
        run: |
          cargo check --all-targets --locked \
            -p cli \
            -p client \
            -p crashes \
            -p fs \
            -p gpui \
            -p gpui_macos \
            -p gpui_platform \
            -p media \
            -p sandbox \
            -p time_format \
            -p util
