name: Release

# PaddleBoard: on a version tag, builds release artifacts and attaches them to the
# Release publish-public.sh created — a signed + notarized macOS (Apple Silicon) DMG
# and a Linux x86_64 tarball. The two jobs are INDEPENDENT: a Linux failure never
# blocks the macOS build (or vice versa). macOS signing is driven by repo secrets
# (below); if they're absent the bundle falls back to an ad-hoc signature. Linux
# needs no secrets.
#
# Required repo secrets for a signed + notarized build:
#   MACOS_SIGNING_IDENTITY        - e.g. "Developer ID Application: Your Name (TEAMID)"
#   MACOS_CERTIFICATE             - base64 of the exported Developer ID .p12
#   MACOS_CERTIFICATE_PASSWORD    - password for that .p12
#   APPLE_NOTARIZATION_KEY        - contents of the App Store Connect API .p8 key
#   APPLE_NOTARIZATION_KEY_ID     - the API key's Key ID
#   APPLE_NOTARIZATION_ISSUER_ID  - the API key's Issuer ID
#
# The git tag must match the paddleboard crate version, i.e. `v<version>`
# (currently v0.1.14). publish-public.sh owns the Release shell (notes, tag, site
# bump) and creates it as a prerelease; this workflow builds the signed DMG and
# ATTACHES it to that Release, then a human promotes it after review with:
#
#   gh release edit vX.Y.Z --prerelease=false --latest
#
# BOTH flags are required. Dropping `--prerelease` alone does NOT move GitHub's
# "Latest" badge — `make_latest` is a separate field that GitHub only computes
# when a non-prerelease release is created, and every release here is CREATED as
# a prerelease. Omitting `--latest` leaves the badge pointing at an old build:
# it sat on v0.1.17 across three releases until someone noticed in July 2026.

on:
  push:
    tags:
      - "v*"

# Serialize per tag, but NEVER cancel: `cancel-in-progress: true` here could kill
# a run midway through `notarytool submit`, leaving a submission Apple has
# accepted with no local ticket to staple. Every other workflow in this repo
# cancels superseded runs; this one deliberately does not.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    # PaddleBoard: macos-15 (Xcode 16.x / newer libc++). macos-14's Xcode 15.4
    # libc++ fails to compile the inherited webrtc-sys cxx bridge under C++20
    # (rust::Slice iterator not treated as a contiguous_iterator). Local builds
    # on a newer Xcode compile it fine, so match the runner toolchain to that.
    runs-on: macos-15
    # RELEASING.md observes 110-190 min for this build, so 240 is headroom rather
    # than a target. It exists because the DEFAULT is 360: a job wedged on a
    # notarization that never returns would bill 3,600 minutes at the macOS 10x
    # multiplier — more than this account spent in the whole of 2026-08-01..04.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build the public stable channel
        run: echo "stable" > crates/paddleboard/RELEASE_CHANNEL

      - name: Validate tag against crate version
        run: script/determine-release-channel

      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin

      - name: Build, sign, notarize, and bundle (Apple Silicon)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          # Public OAuth client id (no secret) baked into the binary at compile
          # time via option_env! — enables "Sign in with GitHub" in Git Logins.
          # Unset until the OAuth app is registered; builds work fine without it.
          PADDLEBOARD_GITHUB_OAUTH_CLIENT_ID: ${{ vars.PADDLEBOARD_GITHUB_OAUTH_CLIENT_ID }}
        run: script/bundle-mac aarch64-apple-darwin

      - name: Attach signed DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # publish-public.sh creates the Release (as a prerelease, with notes)
          # right after pushing this tag, so normally it already exists by the time
          # this ~25-min build finishes. Create-if-missing guards the unlikely race
          # where CI beats the publish script; --clobber makes re-runs idempotent.
          dmg="target/aarch64-apple-darwin/release/PaddleBoard-aarch64.dmg"
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PaddleBoard ${GITHUB_REF_NAME}" \
              --prerelease \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${dmg}#PaddleBoard (Apple Silicon).dmg"

  linux:
    # Independent of the macOS job — a Linux failure won't block the signed DMG or
    # the release. No signing.
    #
    # PaddleBoard: back on a GitHub-hosted runner as of 2026-08-04, reversing
    # 488c2f30ae. That commit moved this to `blacksmith-8vcpu-ubuntu-2204` because
    # "the stock GitHub ubuntu runner OOM-killed the release link phase twice
    # (7GB RAM)" — which was true, and was measured in the PRIVATE dev repo, where
    # standard runners are 2 vCPU / 8 GB. This workflow does not actually run
    # there: `publish-public.sh` ships it to `paddleboarddev/paddleboard`, and
    # every real release (v0.2.1 onward) has run in that PUBLIC repo, where
    # standard runners are **4 vCPU / 16 GB and free and unlimited**. So the fix
    # was applied against the wrong tier's limits: Blacksmith is billed, while the
    # runner that replaced it has more than double the RAM that OOM'd, for free.
    #
    # `ubuntu-22.04`, NOT `ubuntu-latest`: this tarball is distributed to users, so
    # the image sets the glibc floor. A newer image silently raises the minimum
    # distro that can run PaddleBoard, and nothing in CI would catch it.
    #
    # The 2026-07-07 hedges are restored below, because ONE of the two constraints
    # did not improve: RAM went 7 -> 16 GB, but disk is 14 GB on BOTH tiers.
    #
    # If this OOMs or fills the disk anyway, the tarball is the only casualty (the
    # DMG job is independent) — revert this job to blacksmith-8vcpu-ubuntu-2204.
    runs-on: ubuntu-22.04
    # Was unbounded (360 default). Free on the public repo, but an unbounded job
    # is what makes a wedged build expensive if this workflow is ever run from the
    # private repo, as the 2026-07-07 v0.0.0-linuxtest tags did.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build the public stable channel
        run: echo "stable" > crates/paddleboard/RELEASE_CHANNEL

      - name: Free up disk space
        # A full Zed-fork release build produces a large target/ dir; the stock
        # ubuntu runner (~14 GB free on /) can run out mid-build. Reclaim ~20 GB of
        # preinstalled toolchains a Rust build never touches, and print disk/RAM so
        # a resource failure is visible instead of a silently-killed runner.
        # Only CodeQL is taken from /opt/hostedtoolcache, never the whole directory
        # — `actions/*` steps resolve their tools from it.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift || true
          sudo docker image prune --all --force || true
          echo "=== disk ===" ; df -h /
          echo "=== ram ===" ; free -h

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Install webview (wry) system dependencies
        # PaddleBoard: the `browser` crate uses `wry`, whose Linux build needs the
        # GTK3 + WebKit2GTK dev stack (gdk-sys/gtk-sys/javascriptcore/webkit2gtk).
        # script/linux is Zed's dep set and omits these (upstream has no embedded
        # browser). libwebkit2gtk-4.1-dev pulls in gtk-3/gdk/soup/jsc transitively.
        # PaddleBoard: libssl-dev + pkg-config are needed by openssl-sys, pulled
        # in (on Linux only) via native-tls behind paddleboard_rag's `pgvector`
        # feature. macOS uses Secure Transport, so it doesn't need these.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev clang libssl-dev pkg-config

      - name: Set up Rust
        run: rustup update stable

      - name: Add swap space
        # Belt-and-braces, not the load-bearing fix: the public runner's 16 GB
        # should clear the bar that 7 GB failed. Kept because an OOM here is
        # unusually expensive to diagnose — the runner dies mid-build, so the build
        # step's conclusion comes back empty and even the `failure()` log upload
        # never runs, leaving no artifact to read. The swapfile lives on /mnt,
        # which is a separate, much larger ephemeral disk than the 14 GB /.
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build the Linux bundle (x86_64)
        env:
          PADDLEBOARD_GITHUB_OAUTH_CLIENT_ID: ${{ vars.PADDLEBOARD_GITHUB_OAUTH_CLIENT_ID }}
          # Matches the public runner's 4 vCPU. Also caps peak RAM: parallel
          # codegen units are what pushed the old 7 GB runner over the edge.
          CARGO_BUILD_JOBS: "4"
          # PaddleBoard: build the inherited webrtc-sys (LiveKit/Chromium C++) with
          # clang, not the runner's default g++. That code is Clang-only — g++
          # rejects it with "changes meaning of 'Network' [-fpermissive]" in
          # p2p/base/port_interface.h. macOS builds fine because Apple's c++ IS
          # clang; matching that on Linux is the fix.
          CC: clang
          CXX: clang++
        run: |
          # Capture the full output to a file so we can read the error via an
          # uploaded artifact even when GitHub loses the job-log blob (as happened
          # on the first attempts). pipefail keeps bundle-linux's exit code, not tee's.
          set -o pipefail
          script/bundle-linux 2>&1 | tee /tmp/bundle-linux.log

      - name: Upload Linux build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: /tmp/bundle-linux.log
          if-no-files-found: warn

      - name: Disk after build
        if: always()
        run: df -h /

      - name: Attach the Linux tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same create-if-missing + --clobber pattern as the macOS job, so whichever
          # job reaches the release first creates the shell and the other just uploads.
          tarball="$(ls target/release/paddleboard-linux-*.tar.gz | head -1)"
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PaddleBoard ${GITHUB_REF_NAME}" \
              --prerelease \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${tarball}#PaddleBoard (Linux x86_64).tar.gz"
