# PaddleBoard: this file replaces Dependabot's auto-discovery. Every ecosystem
# and path we want covered must be listed here — if a new manifest appears in
# the repo and isn't added below, Dependabot will silently stop tracking it.
#
# Why it exists: `samples/demo` pins its Python dependencies deliberately so the
# presenter script stays reproducible. Auto-discovery kept opening bump PRs
# against those pins.
#
# Deliberately NOT tracked, because nothing in PaddleBoard runs them:
#   /samples/demo                      pinned on purpose (see above)
#   /crates/eval_cli/zed_eval          upstream Zed's eval tooling
#   /script/update_top_ranking_issues  upstream Zed's issue-triage bot
#
# The two Zed tooling paths were listed here in the first version of this file,
# which mirrored auto-discovery exactly. That faithfully preserved tracking for
# tooling this fork inherited but never invokes, and the next Dependabot run
# opened five bump PRs against them. Coverage should track what we actually
# build and run, not what upstream left behind.
version: 2

updates:
  # The Rust workspace.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - "/PERSONAMD"
      - "/crates/json_schema_store/src/schemas"
      - "/script/danger"
    schedule:
      interval: weekly

  # No pip/uv entry: every Python manifest in this repo is either a deliberate
  # pin or upstream tooling we don't run. See the header before adding one.
