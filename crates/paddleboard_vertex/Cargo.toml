[package]
name = "paddleboard_vertex"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/paddleboard_vertex.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
google_ai.workspace = true
http_client.workspace = true
# The workspace entry turns default features off (upstream, 2026-11). PEM parsing
# reads the service-account key, and jsonwebtoken 10 panics at signing time unless
# a crypto backend is enabled; aws_lc_rs is the one this crate already used.
jsonwebtoken = { workspace = true, features = ["use_pem", "aws_lc_rs"] }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
